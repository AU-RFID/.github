name: Archive Stale Repositories (Dry Run)

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 AM UTC
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'Days since last push to consider a repo stale'
        required: false
        default: '365'

jobs:
  archive-stale-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate installation token for rfid-automations
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 1852893
          private-key: ${{ secrets.AUTOMATIONS_PRIVATE_KEY }}
          # Scope the token to this org only
          owner: ${{ github.repository_owner }}

      - name: Find and dry-run archive stale org repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          STALE_DAYS: ${{ github.event.inputs.stale_days || '365' }}
          DRY_RUN: 'true'
        run: |
          set -euo pipefail

          CUTOFF_DATE=$(date -d "-${STALE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)

          echo "=========================================="
          echo "  Stale Repository Archiver"
          echo "  Org    : $ORG"
          echo "  Cutoff : ${STALE_DAYS} days (before $CUTOFF_DATE)"
          echo "  Dry run: $DRY_RUN"
          echo "=========================================="
          echo ""

          CHECKED=0
          STALE_COUNT=0
          SKIPPED_KEEP=0

          # Fetch all non-archived org repos, paginated
          while IFS= read -r repo; do
            NAME=$(echo "$repo"    | jq -r '.name')
            PUSHED=$(echo "$repo"  | jq -r '.pushed_at // empty')
            TOPICS=$(echo "$repo"  | jq -r '.topics | join(" ")')
            IS_FORK=$(echo "$repo" | jq -r '.fork')

            CHECKED=$((CHECKED + 1))

            # Protect repos tagged keep or no-archive
            if echo "$TOPICS" | grep -qE '(^| )(keep|no-archive)( |$)'; then
              echo "  [SKIP]     $NAME — protected topic"
              SKIPPED_KEEP=$((SKIPPED_KEEP + 1))
              continue
            fi

            # Skip empty repos with no push date
            if [ -z "$PUSHED" ]; then
              echo "  [SKIP]     $NAME — no push date (empty repo)"
              continue
            fi

            PUSHED_TS=$(date -d "$PUSHED" +%s)
            CUTOFF_TS=$(date -d "$CUTOFF_DATE" +%s)

            if [ "$PUSHED_TS" -lt "$CUTOFF_TS" ]; then
              STALE_COUNT=$((STALE_COUNT + 1))
              FORK_LABEL=""
              [ "$IS_FORK" = "true" ] && FORK_LABEL=" [fork]"

              if [ "$DRY_RUN" = "true" ]; then
                echo "  [DRY RUN]  Would archive: ${NAME}${FORK_LABEL} — last push: $PUSHED"
              else
                echo "  [ARCHIVING] ${NAME}${FORK_LABEL} — last push: $PUSHED"
                gh api \
                  --method PATCH \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/$ORG/$NAME" \
                  -f archived=true
                echo "  [DONE]     $NAME archived."
              fi
            fi

          done < <(gh api \
            --paginate \
            --jq '.[] | select(.archived == false)' \
            "/orgs/$ORG/repos?per_page=100&type=all")

          echo ""
          echo "=========================================="
          echo "  Summary"
          echo "=========================================="
          echo "  Repos checked    : $CHECKED"
          echo "  Skipped (keep)   : $SKIPPED_KEEP"
          echo "  Stale repos      : $STALE_COUNT"
          echo ""
          if [ "$DRY_RUN" = "true" ]; then
            echo "  ✓ DRY RUN complete — no repos were modified."
            echo "    Set DRY_RUN to 'false' in the workflow when ready to go live."
          else
            echo "  ✓ Done. $STALE_COUNT repo(s) archived."
          fi
          echo "=========================================="
